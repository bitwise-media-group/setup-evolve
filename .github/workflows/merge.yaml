# Caller for the reusable merge workflow, which drives both fast-forward merge flows:
# a maintainer comments `/merge` to fast-forward an approved, green PR now, or arms
# auto-merge (`/auto-merge` comment or the `auto-merge` label) to merge it automatically
# once approved and green. Both run the ff-merge action, so every commit keeps its
# signature and release-please still sees each Conventional Commit individually.
# (Supersedes the previous split merge.yaml + auto-merge.yaml.)
#
# Every trigger is one that does NOT attach a check run to the PR (issue_comment,
# workflow_run, schedule), so no skipped-job clutter lands on the PR's checks list. The
# workflow_run list names every check that must be green -- "Continuous Integration" and
# "Security Analysis" -- plus "Merge Review Ack", whose completion turns an approval into
# a merge attempt (fork and same-repo alike); whichever finishes last triggers it, and
# ff-merge re-verifies all checks before moving the ref. The scheduled sweep backstops any
# missed trigger.
#
# Requires branch protection that requires PR review (so an approval sets the review
# decision). Org prerequisites (one-time -- see bitwise-media-group/ff-merge): the
# FF_MERGE_CLIENT_ID variable + FF_MERGE_PRIVATE_KEY secret, and the "FF Merge" App
# installed on this repo and in main's ruleset bypass list.
#
# Pinned to a full commit SHA; Dependabot keeps the pin fresh.
name: Merge

on:
  issue_comment:
    types: [created]
  workflow_run:
    workflows: ["Continuous Integration", "Security Analysis", "Merge Review Ack"]
    types: [completed]
  schedule:
    # Backstop sweep of armed PRs for any missed event trigger.
    - cron: "17 * * * *"

# the App token does the privileged work; the caller grants nothing
permissions: {}

jobs:
  merge:
    uses: bitwise-media-group/github-workflows/.github/workflows/merge.yaml@b3d4519a6d79376364184f0ca298685dcfa287f2 # v6.1.1
    with:
      app-client-id: ${{ vars.FF_MERGE_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.FF_MERGE_PRIVATE_KEY }}
