# Caller for the reusable CI workflow. It owns the push/pull_request triggers; the
# core work runs in github-workflows/ci.yaml, which runs the canonical mise tasks
# (lint / build / test) as one job each, with every tool -- bun included -- from
# the toolchain submodule's pins. The `build` task regenerates dist/ and the
# reusable workflow fails the run if the committed bundle doesn't reproduce from
# src/.
#
# The integration and e2e matrix jobs are product-specific -- they run this action
# for real against evolve's published releases -- so they stay here alongside the
# reusable `ci` job (a caller may mix a reusable-workflow job with normal jobs).
#
# Pinned to a full commit SHA; Renovate keeps the pin fresh.
name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: ["main", "releases/*"]

# every job here only needs contents:read; grant just that ceiling
permissions:
  contents: read

jobs:
  ci:
    uses: bitwise-media-group/github-workflows/.github/workflows/ci.yaml@35d8e9a1ce772f67f97e73484dc5b7a50c29e0f3 # v8.1.1

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true # the toolchain at .mise/, so mise resolves the same config as the ci job
      # The same mise and bun the reusable ci job runs (the toolchain's pin), but only
      # bun: the integration suite needs nothing else. Its own cache prefix keeps this
      # bun-only install from being restored as the ci job's full toolset.
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: v2026.10.25
          # sha256 of the linux-x64 mise binary for the version above, from the release's
          # SHASUMS256.txt -- the action verifies the extracted binary, not the archive
          sha256: 5d362ecc578dc7c146679b841dda949d6472cbf86ff5635db7afdca1b6b3fd87
          install_args: aqua:oven-sh/bun
          cache_key_prefix: mise-integration
      - run: bun install --frozen-lockfile
      - name: Real sigstore verification against live release assets
        run: bun test __tests__/integration
        env:
          RUN_INTEGRATION: "1"

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        version: [latest, 0.3.0, "~>0", ">=0.1, <1"]
        include:
          - os: ubuntu-latest
            version: latest
            pre-release: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install evolve
        id: setup
        uses: ./ # zizmor: ignore[self-repository] -- the action under test, at this commit; actionlint 1.7.12 rejects $/
        with:
          version: ${{ matrix.version }}
          pre-release: ${{ matrix.pre-release || 'false' }}
          cache: false # exercised separately in e2e-cache

      - name: Assert outputs and binary works
        shell: bash
        env:
          RESOLVED: ${{ steps.setup.outputs.version }}
          INSTALL_PATH: ${{ steps.setup.outputs.path }}
        run: |
          set -eux
          test -n "$RESOLVED"
          test -n "$INSTALL_PATH"
          command -v evolve
          # Release builds print "evolve 0.1.0 (commit ..., built ...)".
          evolve version
          evolve version | grep -F "$RESOLVED"

      - name: Second install hits the runner tool cache
        id: again
        uses: ./ # zizmor: ignore[self-repository] -- the action under test, at this commit; actionlint 1.7.12 rejects $/
        with:
          version: ${{ matrix.version }}
          pre-release: ${{ matrix.pre-release || 'false' }}
          cache: false

      - name: Assert tool-cache hit
        shell: bash
        env:
          CACHE_HIT: ${{ steps.again.outputs.cache-hit }}
        run: test "$CACHE_HIT" = "tool-cache"

  # Exercises the @actions/cache path: the seed job saves, the restore job
  # starts on a fresh runner whose tool cache is empty, restores from the
  # Actions cache, and must re-verify the cached binary.
  e2e-cache-seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./ # zizmor: ignore[self-repository] -- the action under test, at this commit; actionlint 1.7.12 rejects $/
        with:
          version: 0.3.0

  e2e-cache-restore:
    needs: e2e-cache-seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./ # zizmor: ignore[self-repository] -- the action under test, at this commit; actionlint 1.7.12 rejects $/
        with:
          version: 0.3.0
      - name: Assert Actions-cache hit (re-verified)
        shell: bash
        env:
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
        run: |
          set -eux
          test "$CACHE_HIT" = "cache"
          evolve version
