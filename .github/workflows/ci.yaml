# Caller for the reusable CI workflow. It owns the push/pull_request triggers; the
# core work runs in github-workflows/ci.yaml, which runs the canonical mise tasks
# (lint / build / test) as one job each and sets up the toolchains the repo has
# (package.json -> node here). The `build` task regenerates dist/ and the
# reusable workflow fails the run if the committed bundle doesn't reproduce from
# src/.
#
# The integration and e2e matrix jobs are product-specific -- they run this action
# for real against evolve's published releases -- so they stay here alongside the
# reusable `ci` job (a caller may mix a reusable-workflow job with normal jobs).
#
# Pinned to a full commit SHA; Renovate keeps the pin fresh.
name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: ["main", "releases/*"]

# every job here only needs contents:read; grant just that ceiling
permissions:
  contents: read

jobs:
  ci:
    uses: bitwise-media-group/github-workflows/.github/workflows/ci.yaml@b3d4519a6d79376364184f0ca298685dcfa287f2 # v6.1.1

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Real sigstore verification against live release assets
        run: npx vitest run __tests__/integration
        env:
          RUN_INTEGRATION: "1"

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        version: [latest, 0.3.0, "~>0", ">=0.1, <1"]
        include:
          - os: ubuntu-latest
            version: latest
            pre-release: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install evolve
        id: setup
        uses: ./
        with:
          version: ${{ matrix.version }}
          pre-release: ${{ matrix.pre-release || 'false' }}
          cache: false # exercised separately in e2e-cache

      - name: Assert outputs and binary works
        shell: bash
        env:
          RESOLVED: ${{ steps.setup.outputs.version }}
          INSTALL_PATH: ${{ steps.setup.outputs.path }}
        run: |
          set -eux
          test -n "$RESOLVED"
          test -n "$INSTALL_PATH"
          command -v evolve
          # Release builds print "evolve 0.1.0 (commit ..., built ...)".
          evolve version
          evolve version | grep -F "$RESOLVED"

      - name: Second install hits the runner tool cache
        id: again
        uses: ./
        with:
          version: ${{ matrix.version }}
          pre-release: ${{ matrix.pre-release || 'false' }}
          cache: false

      - name: Assert tool-cache hit
        shell: bash
        env:
          CACHE_HIT: ${{ steps.again.outputs.cache-hit }}
        run: test "$CACHE_HIT" = "tool-cache"

  # Exercises the @actions/cache path: the seed job saves, the restore job
  # starts on a fresh runner whose tool cache is empty, restores from the
  # Actions cache, and must re-verify the cached binary.
  e2e-cache-seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          version: 0.3.0

  e2e-cache-restore:
    needs: e2e-cache-seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./
        with:
          version: 0.3.0
      - name: Assert Actions-cache hit (re-verified)
        shell: bash
        env:
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
        run: |
          set -eux
          test "$CACHE_HIT" = "cache"
          evolve version
