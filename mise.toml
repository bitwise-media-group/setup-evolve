#
# setup-evolve consumes the shared toolchain (bitwise-media-group/toolchain) as
# the .mise/ submodule: pinned tools come from its config.toml (loaded natively
# as .mise/config.toml), the shared tasks from common/ and the node archetype,
# and the Makefile is a thin forwarder (.mise/archetypes/node/include.mk). The
# biome + rollup + vitest toolchain is exactly what the archetype drives, so
# there are no repo-local tasks — the integration and e2e suites that exercise
# the published action run in CI, not through the task graph. node is pinned
# here (the repo's own runtime, bumped by this repo's Renovate workflow) and
# locked in mise.lock; keep .node-version, which the CI integration job feeds
# to actions/setup-node, on the same version.

[settings]
lockfile = true

[tools]
node = "24.21.0"

[vars]
# a GitHub Action repo: npm ci runs the lifecycle scripts
npm_ci_flags = ""

[task_config]
includes = [".mise/common/tasks.toml", ".mise/archetypes/node/tasks.toml"]
